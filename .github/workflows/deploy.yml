# Publishes the site to the kwalbania.al Plesk hosting over FTPS.
# Runs on every push to main, or manually from the Actions tab.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy to kwalbania.al

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload to Plesk (httpdocs)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: httpdocs/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            DEPLOY.md
            *_ColorGraded.mp4
